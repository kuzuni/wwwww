<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- 폰 브라우저(크롬 Auto Dark, 안드로이드 WebView FORCE_DARK, 삼성 인터넷 다크모드)가 색을 강제로 뒤집지 않도록.
     ⚠️ `content="light"` 는 옵트아웃이 **아니다** — '라이트를 지원한다'는 선언일 뿐이라 크롬은 오히려
     그런 페이지를 자동 반전 대상으로 삼는다(tools/probe-force-dark.js 실측: light 만 두면 #f5f5f5 → #222).
     반전을 끄는 건 `only` 키워드다. CSS(:root color-scheme)와 함께 두 겹으로 건다. -->
<meta name="color-scheme" content="only light">
<title>포지 클론 — 방치형 대장간 RPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 부팅 로딩 오버레이 (startup-lag-loading, 사용자 지시 2026-08-19) — 실측(probe-startup-cpuprofile)상
     시작 렉의 지배 비용은 JS 부팅(~0.7s)이 아니라 **첫 렌더의 셰이더 프로그램 컴파일(three.min.js, 수 초)**이다.
     그 컴파일은 없앨 수 없으므로 로딩창 아래에서 소화한다(Scene3D.warmup). main.js boot()가 단계마다
     진행률을 갱신하고 끝나면 페이드아웃 후 제거한다.
     ⚠️ 스타일은 style.css가 아니라 인라인이다 — 이 오버레이는 뒤따르는 무거운 스크립트 평가가 시작되기
     전에 그려져야 의미가 있어서 외부 CSS 클래스에 의존하지 않는다. 마크업도 #app 앞(파서가 먼저 만나게). -->
<div id="boot-loading">
<style>
#boot-loading { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 30%, #2a3550 0%, #171e30 55%, #0d1220 100%);
    transition: opacity .4s ease; font-family: system-ui, sans-serif; }
#boot-loading.bl-done { opacity: 0; pointer-events: none; }
#boot-loading .bl-box { display: flex; flex-direction: column; align-items: center; gap: 14px; }
/* 대장간 엠블럼: CSS 모루 + 두드리는 망치 + 타격 불꽃 (에셋 없음 — 전부 코드 생성 제약) */
#boot-loading .bl-forge { position: relative; width: 96px; height: 84px; }
#boot-loading .bl-anvil { position: absolute; left: 50%; bottom: 8px; width: 64px; height: 22px; transform: translateX(-50%);
    background: linear-gradient(#5d6a80, #3a4356); border-radius: 4px 10px 3px 3px;
    clip-path: polygon(0 0, 100% 0, 82% 45%, 70% 100%, 30% 100%, 18% 45%); }
#boot-loading .bl-anvil::after { content: ''; position: absolute; left: 50%; top: 100%; width: 30px; height: 10px;
    transform: translateX(-50%); background: #2c3344; border-radius: 0 0 4px 4px; }
#boot-loading .bl-hammer { position: absolute; left: 58%; bottom: 30px; width: 44px; height: 44px;
    transform-origin: 88% 88%; animation: bl-swing 1s cubic-bezier(.55, 0, .3, 1) infinite; }
#boot-loading .bl-hammer::before { content: ''; position: absolute; left: 0; top: 2px; width: 22px; height: 14px;
    background: linear-gradient(#8b97ab, #55617a); border-radius: 3px; }
#boot-loading .bl-hammer::after { content: ''; position: absolute; left: 9px; top: 12px; width: 5px; height: 32px;
    background: linear-gradient(#a8794a, #7a5430); border-radius: 2px; transform: rotate(24deg); }
@keyframes bl-swing { 0%, 12% { transform: rotate(-52deg); } 38%, 55% { transform: rotate(6deg); } 100% { transform: rotate(-52deg); } }
#boot-loading .bl-spark { position: absolute; left: 46%; bottom: 26px; width: 5px; height: 5px; border-radius: 50%;
    background: #ffd873; opacity: 0; animation: bl-spark 1s ease-out infinite; }
#boot-loading .bl-spark.s2 { animation-delay: .05s; --dx: -16px; --dy: -20px; }
#boot-loading .bl-spark.s3 { animation-delay: .1s; --dx: 18px; --dy: -14px; }
@keyframes bl-spark { 0%, 36% { opacity: 0; transform: none; } 44% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx, 8px), var(--dy, -26px)) scale(.4); } }
#boot-loading .bl-title { color: #f2e8d8; font-size: 22px; font-weight: 800; letter-spacing: .12em; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
#boot-loading .bl-track { width: 216px; height: 8px; border-radius: 5px; background: rgba(255,255,255,.12);
    overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
#boot-loading .bl-fill { width: 0%; height: 100%; border-radius: 5px; transition: width .25s ease;
    background: linear-gradient(90deg, #e8a33d, #ffd873); box-shadow: 0 0 8px rgba(255,216,115,.7); }
#boot-loading .bl-stage { color: #9aa7c0; font-size: 12px; min-height: 1.2em; }
</style>
<div class="bl-box">
    <div class="bl-forge"><div class="bl-anvil"></div><div class="bl-hammer"></div><i class="bl-spark"></i><i class="bl-spark s2"></i><i class="bl-spark s3"></i></div>
    <div class="bl-title">포지 클론</div>
    <div class="bl-track"><div class="bl-fill" id="bl-fill"></div></div>
    <div class="bl-stage" id="bl-stage">불 지피는 중…</div>
</div>
</div>
<div id="app">
    <!-- 상단 재화 바 -->
    <div id="topbar"></div>

    <!-- 3D 전투 영역 -->
    <div id="game-area">
        <canvas id="game3d"></canvas>
        <div id="fx-layer"></div>

        <div id="stage-label"></div>
        <div id="wave-pips"></div>
        <!-- 오프라인 보상 = 상자 + 상자에서 올라오는 zzz (사용자 지시 2026-08-19).
             '오프라인' 글자는 없앴고 상자 그림만 남는다 — 아이콘은 부팅 때 UI.paintStaticIcons 가 .ob-chest 에 채운다. -->
        <button id="offline-btn" title="오프라인 보상" aria-label="오프라인 보상">
            <span class="ob-zzz" aria-hidden="true"><i>z</i><i>z</i><i>z</i></span>
            <span class="ob-chest">💤</span>
        </button>

        <!-- 맵 위 이정표 오브젝트 (UI-SPEC 1번): 리그 보상 상자 / 미스터리 상자 / 진행 패스 진입점 -->
        <!-- 리그 보상(시상대+왕관) 이정표는 삭제했다 — 사용자 지시 2026-08-19 "메인에 왼쪽에 랭킹 버튼 없애기".
             리그 보상 팝업은 PVP 탭 → 리그 시트의 시즌 바(UI.openLeagueRewards)로 그대로 들어간다. -->
        <button id="waypoint-mystery" class="waypoint" title="미스터리 상자" onclick="UI.onWaypointMystery()">
            <span class="waypoint-icon">❓</span><span id="waypoint-mystery-time" class="waypoint-time"></span>
        </button>
        <button id="waypoint-pass" class="waypoint" title="진행 패스" onclick="UI.openPass()">
            <span class="waypoint-icon">⚔️</span>
        </button>

        <div id="skill-cutin"></div>
        <div id="skill-flash"></div>
        <div id="loot-feed"></div>

        <!-- 스킬 슬롯: 전투 화면 우중단 (UI-SPEC 1번 — 자동 토글 + 원형 버튼 3개) -->
        <div id="skill-bar"></div>

        <!-- 영웅 피격 비네트 — **전투 씬 안**에 둔다 (사용자 지시 2026-08-18로 번복).
             예전에는 #app 직속 풀스크린이었다: #game-area 안에 두면 경계선 y 에서 붉은 기가
             직선으로 잘려 보인다는 이유였다. 사용자가 "피격해서 화면 빨개지는 거도 전투씬
             화면에서만 빨개지게 하고 메인의 다른 UI 침범 안 하게" 로 뒤집었다 —
             직선 컷은 css 에서 아래쪽을 투명으로 페이드(mask)해 없앴다. 되돌리지 말 것. -->
        <div id="dmg-flash"></div>

        <!-- 보스 경고 연출 (사용자 지시: "워닝 워닝 워닝" 느낌으로 화려하게)
             ⚠️ 이것도 **전투 씬 안**이다 (사용자 추가 지시 2026-08-18: "보스 연출 또한 UI 위로
             뜨지 말라"). 예전 주석은 "#app 직속이라야 장비 시트·탭바까지 화면 전체를 덮는다"
             였는데 그 전제가 번복됐다 — 덮으면 안 된다. 타이밍(scene3d 의 BOSS_WARN_DUR·사이렌)은
             그대로고 **범위만** 바뀌었다.
             한 줄 텍스트는 안에서 두 번 반복해 둔다 — 마퀴 트랙을 translateX(-50%)로 굴려
             이음매 없이 흐르게 하려면 두 조각의 폭이 정확히 같아야 한다. -->
        <div id="boss-warning" class="hidden">
            <div class="bw-dim"></div>
            <div class="bw-flash"></div>
            <div class="bw-banner">
                <div class="bw-hazard"></div>
                <div class="bw-marquee">
                    <div class="bw-track">
                        <span>WARNING ◆ WARNING ◆ WARNING ◆ WARNING ◆ </span>
                        <span>WARNING ◆ WARNING ◆ WARNING ◆ WARNING ◆ </span>
                    </div>
                </div>
                <div class="bw-hazard"></div>
            </div>
            <div class="bw-sub">보스 출현</div>
        </div>
    </div>

    <!-- 장비 시트 (상시 노출 — 대장간 탭 대체) -->
    <div id="equip-sheet"></div>

    <!-- 채팅 미리보기 1줄 (탭하면 전체화면 채팅, UI-SPEC 28번) -->
    <div id="chat-preview" onclick="UI.openChat()"></div>

    <!-- 패널 (하단 시트, 탭으로 토글) -->
    <div id="panel-summon" class="panel">
        <!-- 원본(shot-042340): 실버 세그먼트 통짜 바, 순서 스킬|펫|기술 트리, 활성=파랑 채움 -->
        <div id="summon-subtabs" class="subtab-strip">
            <div class="subtab-pill">
                <button data-sub="skills" onclick="UI.switchSummonSub('skills')">스킬</button>
                <button data-sub="pets" onclick="UI.switchSummonSub('pets')">펫</button>
                <button data-sub="tech" onclick="UI.switchSummonSub('tech')">기술 트리</button>
            </div>
        </div>
        <div id="panel-pets" class="summon-sub"></div>
        <div id="panel-skills" class="summon-sub"></div>
        <div id="panel-tech" class="summon-sub"></div>
    </div>
    <div id="panel-debug" class="panel"></div>

    <!-- 하단 탭 (사용자 지시 2026-08-18: "pvp, 던전, 소환, 상점 이 순서로 박고 방은 없애라")
         · PVP = 리그 도전(openLeague)이 이 게임의 PvP다 — 옛 '전투' 탭을 승격시킨 것.
         · '전투'는 방치형 메인 화면이라 탭이 아니라 홈이다(다른 탭/팝업을 닫으면 자동 복귀).
         · '방'(panel-menu) 삭제 — 그 안의 진입점은 전부 다른 곳에 있다:
           기술 트리=소환 서브탭 · 마운트=장비 시트 탈것 칸 · 승천=대장간 정보 팝업 ·
           진행 패스=맵 이정표 · 정보=플레이어 정보 팝업(!) · 저장/초기화=프로필▸설정.
         · 디버그는 배포 탭바에서 숨기고 ?debug= / ?tab=debug 로만 노출한다(main.js). -->
    <div id="tabbar">
        <!-- 아이콘은 IconGen 캔버스 아이콘으로 교체된다(UI.hydrateTabIcons). data-ico 가 생성기 이름이고,
             안의 이모지는 스크립트 이전 첫 프레임용 폴백이다. -->
        <button data-tab="pvp" data-ico="tab_pvp">⚔️<span>PVP</span></button>
        <button data-tab="dungeon" data-ico="tab_dungeon">💀<span>던전</span></button>
        <button data-tab="summon" data-ico="tab_summon">🧪<span>소환</span></button>
        <button data-tab="quest" data-ico="tab_quest">📜<span>퀘스트</span></button>
        <button data-tab="shop" data-ico="tab_shop">🏪<span>상점</span></button>
        <button data-tab="debug" data-ico="tab_debug">🐞<span>디버그</span></button>
    </div>

    <!-- #dmg-flash · #boss-warning 은 2026-08-18 사용자 지시로 **#game-area 안으로 옮겼다**
         (이 파일 위쪽, #skill-bar 다음). 여기서 찾지 말 것. -->

    <!-- 모달/토스트 -->
    <div id="craft-modal" class="modal hidden"></div>
    <div id="offline-modal" class="modal hidden"></div>
    <div id="dungeon-modal" class="modal hidden"></div>
    <div id="dungeon-detail-modal" class="modal hidden"></div>
    <!-- 던전 클리어 보상 팝업 — 배경 탭으로 닫히지 않는다: [보상 수령]을 눌러야 수령 연출 → 본대 복귀가 이어진다 -->
    <div id="dungeon-clear-modal" class="modal hidden"></div>
    <div id="pet-upgrade-modal" class="modal hidden"></div>
    <div id="mount-modal" class="modal hidden"></div>
    <div id="mount-upgrade-modal" class="modal hidden"></div>
    <div id="ascend-modal" class="modal hidden"></div>
    <div id="stub-modal" class="modal hidden"></div>
    <div id="forge-info-modal" class="modal hidden"></div>
    <div id="detail-modal" class="modal hidden" onclick="if (event.target === this) UI.closeDetail()"></div>
    <div id="forge-item-modal" class="modal hidden" onclick="if (event.target === this) UI.closeForgeItemDetail()"></div>
    <div id="autoforge-modal" class="modal hidden"></div>
    <div id="league-modal" class="modal hidden"></div>
    <div id="pass-modal" class="modal hidden"></div>
    <div id="quest-modal" class="modal hidden"></div>
    <div id="shop-modal" class="modal hidden"></div>
    <div id="profile-modal" class="modal hidden"></div>
    <div id="player-info-modal" class="modal hidden"></div>
    <div id="chat-modal" class="modal hidden"></div>
    <div id="gear-detail-modal" class="modal hidden" onclick="if (event.target === this) UI.closeGearDetail()"></div>
    <!-- 소환 결과 연출: 탭바(z-index 30)까지 덮는 풀스크린 오버레이라 별도 z-index를 CSS에서 준다 -->
    <div id="summon-result-modal" class="modal hidden" onclick="UI.onSummonResultTap()"></div>
    <div id="toasts"></div>
    <!-- 스테이지에서 벌어진 일을 알리는 토스트만 따로 받는 레인 (사용자 지시 2026-08-18).
         일반 토스트(#toasts, z 30)는 팝업 위에 그대로 뜬다 — 대개 그 팝업에서 누른 버튼의
         응답이라 가려지면 안 되기 때문이다. 반면 '한 스테이지 후퇴' 같은 전투 알림은
         플레이어가 팝업을 읽는 중에 끼어들면 안 된다. z-index 는 컨테이너가 스택 문맥을
         만들어 자식만 따로 내릴 수 없으므로 **레인을 하나 더 두는 것**이 유일한 방법이다. -->
    <div id="toasts-combat"></div>
</div>

<script src="lib/three.min.js"></script>
<script src="js/bignum.js"></script>
<script src="js/util.js"></script>
<script src="js/icongen.js"></script>
<script src="js/avatars.js"></script>
<script src="js/sfx.js"></script>
<script src="js/balance-data.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/voxel.js"></script>
<!-- 🧊 마인크래프트 몹 문법 박스 모델 (pet-mount-minecraft-remake) — voxel.js 뒤, scene3d.js 앞이어야 한다 -->
<script src="js/mobs.js"></script>
<script src="js/mobdata.js"></script>
<script src="js/mobs-pets.js"></script>
<script src="js/mobs-mounts.js"></script>
<script src="js/prochar.js"></script>
<script src="js/state.js"></script>
<script src="js/forge.js"></script>
<script src="js/pets.js"></script>
<script src="js/skills.js"></script>
<script src="js/dungeons.js"></script>
<script src="js/techtree.js"></script>
<script src="js/mounts.js"></script>

<script src="js/ascension.js"></script>
<script src="js/league.js"></script>
<script src="js/pass.js"></script>
<script src="js/shop.js"></script>
<script src="js/chat.js"></script>
<script src="js/combat.js"></script>
<script src="js/scene3d.js"></script>

<script src="js/main.js"></script>
</body>
</html>
