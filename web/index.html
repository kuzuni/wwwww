<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>포지 클론 — 방치형 대장간 RPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
    <!-- 상단 재화 바 -->
    <div id="topbar"></div>

    <!-- 3D 전투 영역 -->
    <div id="game-area">
        <canvas id="game3d"></canvas>
        <div id="fx-layer"></div>

        <div id="stage-label"></div>
        <div id="wave-pips"></div>
        <button id="farm-toggle"></button>
        <button id="offline-btn">💤<span>오프라인</span></button>

        <div id="boss-bar" class="hidden">
            <span class="boss-name">👑 BOSS</span>
            <div class="boss-track"><div id="boss-bar-fill"></div></div>
        </div>
        <div id="boss-warning" class="hidden">⚠️ BOSS ⚠️</div>
        <div id="skill-cutin"></div>
        <div id="skill-flash"></div>
        <div id="dmg-flash"></div>
        <div id="loot-feed"></div>

        <div id="hero-hp-wrap">
            <div id="hero-hp-track"><div id="hero-hp-fill"></div></div>
            <span id="hero-hp-text"></span>
        </div>
    </div>

    <!-- 스킬 바 -->
    <div id="skill-bar"></div>

    <!-- 장비 시트 (상시 노출 — 대장간 탭 대체) -->
    <div id="equip-sheet"></div>

    <!-- 패널 (하단 시트, 탭으로 토글) -->
    <div id="panel-summon" class="panel"></div>
    <div id="panel-pets" class="panel"></div>
    <div id="panel-skills" class="panel"></div>
    <div id="panel-menu" class="panel"></div>
    <div id="panel-debug" class="panel"></div>

    <!-- 하단 탭 -->
    <div id="tabbar">
        <button data-tab="dungeon">💀<span>던전</span></button>
        <button data-tab="menu">🚪<span>방</span></button>
        <button data-tab="summon">🧪<span>소환</span></button>
        <button data-tab="battle">🚩<span>전투</span></button>
        <button data-tab="shop">🏪<span>상점</span></button>
        <button data-tab="debug">🐞<span>디버그</span></button>
    </div>

    <!-- 모달/토스트 -->
    <div id="craft-modal" class="modal hidden"></div>
    <div id="offline-modal" class="modal hidden"></div>
    <div id="dungeon-modal" class="modal hidden"></div>
    <div id="dungeon-detail-modal" class="modal hidden"></div>
    <div id="pet-upgrade-modal" class="modal hidden"></div>
    <div id="tech-modal" class="modal hidden"></div>
    <div id="mount-modal" class="modal hidden"></div>
    <div id="ascend-modal" class="modal hidden"></div>
    <div id="stub-modal" class="modal hidden"></div>
    <div id="forge-info-modal" class="modal hidden"></div>
    <div id="autoforge-modal" class="modal hidden"></div>
    <div id="toasts"></div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/SkeletonUtils.js"></script>
<script src="assets/models-data.js"></script>
<script src="js/models.js"></script>
<script src="js/util.js"></script>
<script src="js/sfx.js"></script>
<script src="js/balance-data.js"></script>
<script src="js/gamedata.js"></script>
<script src="js/state.js"></script>
<script src="js/forge.js"></script>
<script src="js/pets.js"></script>
<script src="js/skills.js"></script>
<script src="js/dungeons.js"></script>
<script src="js/techtree.js"></script>
<script src="js/mounts.js"></script>
<script src="js/ascension.js"></script>
<script src="js/combat.js"></script>
<script src="js/scene3d.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
